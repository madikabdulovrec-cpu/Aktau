# Wrangler config — Worker «Пульс продаж» M&M Fabrica.
# Cron-дайджест «как идут продажи» в рабочий чат отдела + приём вебхука message.help.
#
# Деплой:  wrangler deploy --config worker/wrangler-mm-pulse-bot.toml
# Полная инструкция:  worker/MM_PULSE_BOT_SETUP.md

name = "mm-pulse-bot"
main = "mm-pulse-bot.js"
compatibility_date = "2025-05-01"
account_id = "650cb2300c9e29301178d3e5998be3b4"

# Cron — Cloudflare использует UTC. Алматы = UTC+5, перевода часов в Казахстане нет.
# 3-16 UTC = ежечасно 08:00–20:00 (пульс) + 21:00 (итог дня) Алматы. Ночью молчим. 7 дней.
[triggers]
crons = ["0 3-16 * * *"]

# KV namespace — бакеты событий дня (events:YYYY-MM-DD) + кэш токена message.help.
# ЗАПОЛНИТЬ id перед деплоем:  wrangler kv namespace create mm-pulse-kv
[[kv_namespaces]]
binding = "PULSE_KV"
id = "100bb068db2f410b8da6f760f9ad3970"

# Plaintext-переменные (НЕ секреты). Заполнить перед деплоем.
[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-6"   # макс. качество: claude-opus-4-7
AI_JUDGE = "1"                          # ИИ сам читает диалоги и решает, кто реально «без ответа». "0" — выключить.
BROADCAST_REPORT = "0"                   # письма по летней рассылке в чат: "0" — пауза, "1" — слать (до 15.06).
AI_GATEWAY = "mm-pulse"                 # имя Cloudflare AI Gateway. Пусто = прямой вызов (блокируется 403).
DEBUG_RAW = "0"                         # Диагностика: пишет сырые вебхуки в KV (?rawdump=). Включать только на время отладки.
MH_PROJECT_ID = "220763"                # id проекта message.help — ПОДТВЕРДИТЬ
UNANSWERED_THRESHOLD_MIN = "20"         # порог «без ответа сейчас», мин
SELLERS = ""                            # seed-список сотрудников (только если KV пуст). Дальше список ведут управляющие из бота → KV cfg:sellers.
ALTEGIO_COMPANY_ID = "1330174"          # id филиала Altegio — для KPI администраторов (кнопка «Администраторы»).
# PII — НЕ в git (репозиторий публичный), хранятся СЕКРЕТАМИ. Значения — в worker/pulse-deploy.local.txt:
#   TELEGRAM_CHAT_ID  — id рабочего чата отдела (для группы отрицательный)
#   INTERNAL_PHONES   — телефоны сотрудников/внутренние номера, через запятую (отсев из метрик)
#   ADMIN_IDS         — Telegram ID управляющих, через запятую (узнать: /id боту)

# Секреты — ставятся отдельными командами, в этом файле НЕ хранятся:
#   wrangler secret put ANTHROPIC_API_KEY  --config worker/wrangler-mm-pulse-bot.toml
#   wrangler secret put TELEGRAM_BOT_TOKEN --config worker/wrangler-mm-pulse-bot.toml
#   wrangler secret put DIGEST_SECRET      --config worker/wrangler-mm-pulse-bot.toml
#   wrangler secret put WEBHOOK_SECRET     --config worker/wrangler-mm-pulse-bot.toml
#   wrangler secret put MH_LOGIN           --config worker/wrangler-mm-pulse-bot.toml
#   wrangler secret put MH_PASSWORD        --config worker/wrangler-mm-pulse-bot.toml
#   --- PII (репо публичный — только секретами, значения в pulse-deploy.local.txt) ---
#   wrangler secret put TELEGRAM_CHAT_ID   --config worker/wrangler-mm-pulse-bot.toml
#   wrangler secret put INTERNAL_PHONES    --config worker/wrangler-mm-pulse-bot.toml
#   wrangler secret put INTERNAL_NAMES     --config worker/wrangler-mm-pulse-bot.toml  (имена внутр. контактов без телефона, напр. владелец в IG)
#   wrangler secret put ADMIN_IDS          --config worker/wrangler-mm-pulse-bot.toml
#   --- Altegio (кнопка «Администраторы», только чтение журнала записей) ---
#   значения секретов — в worker/pulse-deploy.local.txt (gitignored):
#   wrangler secret put ALTEGIO_PARTNER_TOKEN  --config worker/wrangler-mm-pulse-bot.toml
#   wrangler secret put ALTEGIO_OWNER_LOGIN    --config worker/wrangler-mm-pulse-bot.toml
#   wrangler secret put ALTEGIO_OWNER_PASSWORD --config worker/wrangler-mm-pulse-bot.toml  (пароль владельца — для POST /auth, самообновление токена)
#   # ИЛИ вместо логина/пароля — готовый owner-токен напрямую (протухает при смене пароля):
#   wrangler secret put ALTEGIO_USER_TOKEN     --config worker/wrangler-mm-pulse-bot.toml
#
# После деплоя:
#   вебхук для message.help —  https://mm-pulse-bot.<account>.workers.dev/?secret=<WEBHOOK_SECRET>
#   ручной триггер дайджеста — https://mm-pulse-bot.<account>.workers.dev/?secret=<DIGEST_SECRET>
#   регистрация вебхука —      https://mm-pulse-bot.<account>.workers.dev/?register=<DIGEST_SECRET>
#   приём кнопок (setWebhook) — https://mm-pulse-bot.<account>.workers.dev/?tgsetup=<DIGEST_SECRET>   (разово)
#   карточка смены вручную —    https://mm-pulse-bot.<account>.workers.dev/?shiftcard=<DIGEST_SECRET>
