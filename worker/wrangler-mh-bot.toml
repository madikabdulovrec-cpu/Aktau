# Wrangler config для деплоя Worker'а mh-bot — бот первичной обработки заявок
# M&M Fabrica, интеграция с message.help.
#
# Деплой:  wrangler deploy --config worker/wrangler-mh-bot.toml
# Полная инструкция:  worker/MH_BOT_SETUP.md

name = "mh-bot"
main = "mh-bot.js"
compatibility_date = "2025-05-01"
account_id = "650cb2300c9e29301178d3e5998be3b4"

# Cron-триггеры:
#   broadcast — для темпа 25–30/час: 6 тиков/час × 5 отправок = 30/час.
#   confirmation — тот же tick, потолок 4/час WA1/WA2 (override 2/час WA1)
#                  всё равно срежет если кандидатов много.
# Каждый tick остаётся 7.5 мин (5 × 90с pause), укладывается в timeout
# Cloudflare scheduled event.
[triggers]
crons = ["*/10 * * * *"]

# KV namespace — история диалогов, дедуп, кэш токена/слотов, карточки лидов.
# Ниже — id существующего mm-bot-kv: его можно переиспользовать (прототип Wazzup
# отключён). Либо создать новый:  wrangler kv namespace create mh-bot-kv
[[kv_namespaces]]
binding = "BOT_KV"
id = "729a6c1778f24eaf82b875a8bfea9987"

# Workers AI — транскрипция голосовых клиентов (Whisper). Без него бот просто
# просит написать текстом (graceful degradation).
[ai]
binding = "AI"

# KV mm-pulse-bot — READ-ONLY по соглашению (зеркально его binding'у MH_KV):
# дневной режим лид-бота читает журнал событий events:YYYY-MM-DD, чтобы не
# влезать в чаты, где сегодня-вчера уже отвечал человек (humanOwnsDialog).
# Писать сюда из mh-bot ЗАПРЕЩЕНО (namespace принадлежит pulse).
[[kv_namespaces]]
binding = "PULSE_KV"
id = "100bb068db2f410b8da6f760f9ad3970"

# Plaintext-переменные (НЕ секреты). Заполнить перед деплоем.
[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-6"   # макс. качество диалогов (решение владельца). Дешёвый вариант: claude-haiku-4-5-20251001
MH_PROJECT_ID = "220763"                # id проекта message.help — ПОДТВЕРДИТЬ
MH_CHANNELS = '{"17222":"3a00d58f-4060-42be-96b9-898cba18748e","20916":"71608151-e312-48d2-b103-524c8b2e146e"}'  # WhatsApp 1 (17222) + WhatsApp 2 (20916)
# Спец-режим для свежеподключенного канала был активен 05-06.06.2026 (WA1 17222
# после даунтайма, потолок 2/час). СНЯТО 11.06.2026: прошло 5 дней без проблем,
# возвращаем default CONFIRM_PER_CHANNEL_HOURLY_MAX (=6/час).
MH_CHANNEL_HOURLY_OVERRIDE = ''
MANAGER_OPERATOR_ID = ""                # id оператора-менеджера message.help (опц.)
ALTEGIO_COMPANY_ID = "1330174"                 # id филиала Altegio (опц. — гейт и слоты)
ALTEGIO_CONSULT_SERVICE_ID = "13190960"         # id услуги-консультации Altegio (опц. — слоты)

# ── РАССЫЛКА ─────────────────────────────────────────────────────────────────
# '1' — runBroadcastJob активен, шлёт акции по базе активных клиентов на WA2.
# '0' — выключен. Выключить ОБЯЗАТЕЛЬНО после завершения кампании.
BROADCAST_ACTIVE = "0"   # ВЫКЛ 16.06.2026 — летняя акция была по 15.06, кампания завершена (решение владельца)
# Подтверждения шлём СТРОГО через тот канал, через который клиент уже писал
# нам (из MH_CHANNELS). Клиентам, которые никогда не писали в WhatsApp, бот
# напоминания не отправляет — чтобы не наводить шума с нового номера.

# ── КЭВ (договорённость о визите) ────────────────────────────────────────────
KEV_NUDGE = "0"                 # WS-D дожим незавершённого КЭВ: "1" — включить (отдельное решение владельца)
KEV_SLA_DAY_MIN = "60"          # SLA оформления дневного КЭВ менеджером, минут
KEV_NIGHT_DEADLINE = "10:30"    # ночные КЭВ (21:00–07:00) оформить до этого часа утра
KEV_MARKER = "[чат-бот]"        # маркер источника в комментарии записи Altegio (по нему чекер качества)
CONFIRM_LATE_TOLERANCE_MIN = "10"  # ответ на напоминание с временем прихода ≤ N мин от брони → запись авто-подтверждена; больше → администратору

# ── FOLLOW-UP ПОСЛЕ КОНСУЛЬТАЦИИ (две ветки) ─────────────────────────────────
# Пришедшие на консультацию (Altegio attendance=1 у услуги 13190960) делятся по
# тому, взял ли клиент процедуру (определяется по записям клиента в Altegio):
#   • НЕ взял («ушёл думать») → дожим в ТОТ ЖЕ день в CONSULT_FU_THINK_HOUR.
#   • ВЗЯЛ процедуру (сделал/записался) → на СЛЕДУЮЩИЙ день в CONSULT_FU_CARE_HOUR
#     (сделал → «как самочувствие?»; записался → «спасибо, ждём вас <дата>»).
# ВКЛючать после сверки ?consultfutest=<WEBHOOK_SECRET>. Анти-бан — общий с
# напоминаниями (cold-фильтр + потолки канала).
CONSULT_FOLLOWUP_ACTIVE = "0"        # "1" — включить follow-up после консультации
CONSULT_FU_THINK_HOUR = "20"         # ветка «ушёл думать»: дожим в ТОТ ЖЕ день в этот час (Almaty)
CONSULT_FU_CARE_HOUR = "12"          # ветка «взял процедуру»: на СЛЕДУЮЩИЙ день в этот час
CONSULT_FU_PROC_HORIZON_DAYS = "14"  # на сколько дней вперёд запись на процедуру считается конверсией

# ── АНАЛИТИКА / SELF-ОТЧЁТ ───────────────────────────────────────────────────
# Раз в сутки в этот час (Almaty) бот шлёт в Telegram управления отчёт воронки
# (входящие/КЭВ/передачи/подтверждения за прошедшие сутки) + heartbeat «я жив».
# Текущая воронка в любой момент: GET ?stats=<WEBHOOK_SECRET>.
DAILY_REPORT_HOUR = "9"

# ── НОЧНАЯ АВТО-ЗАПИСЬ НА КОНСУЛЬТАЦИЮ (Altegio book_record) ──────────────────
# Бот САМ записывает на бесплатную консультацию (услуга 13190960) к мастерам из
# allowlist, только в окно 10:00–20:00. БЕЗОПАСНО при пустом allowlist → фоллбэк
# на обычный КЭВ. РЕАЛЬНАЯ запись включится ТОЛЬКО после заполнения
# ALTEGIO_CONSULT_STAFF_IDS (владелец настраивает консультантов bookable в
# онлайн-записи Altegio → сверка ?staffdump=<WEBHOOK_SECRET> → вписать сюда).
NIGHT_AUTOBOOK = "1"            # kill-switch (1 вкл / 0 выкл). При пустом allowlist всё равно фоллбэк
AUTOBOOK_DAY_MODE = "off"       # днём НЕ записывает (только менеджеры). "on" — и днём
# 3 руководителя-консультанта (go-live 14.06.2026). Вероника + Мария Александровна
# готовы (услуга привязана, слоты есть); Мария Викторовна подключится, когда ей
# зададут график в Altegio (код не предлагает слоты мастера без расписания).
ALTEGIO_CONSULT_STAFF_IDS = '{"2916732":"Вероника","3013864":"Мария Александровна","2933053":"Мария Викторовна"}'
AUTOBOOK_START = "10:00"        # начало бронируемого окна (включительно)
AUTOBOOK_END = "20:00"          # крайнее время старта консультации (включительно)
AUTOBOOK_FORBID_START = "08:00" # запрещённый интервал начало
AUTOBOOK_FORBID_END = "10:00"   # запрещённый интервал конец (10:00 уже можно)
AUTOBOOK_HORIZON_DAYS = "3"     # на сколько дней вперёд предлагать слоты
AUTOBOOK_MAX_OFFERS = "3"       # сколько слотов показать клиенту (2–3)

# Секреты — ставятся отдельными командами, в этом файле НЕ хранятся:
#   wrangler secret put ANTHROPIC_API_KEY     --config worker/wrangler-mh-bot.toml
#   wrangler secret put MH_LOGIN              --config worker/wrangler-mh-bot.toml
#   wrangler secret put MH_PASSWORD           --config worker/wrangler-mh-bot.toml
#   wrangler secret put WEBHOOK_SECRET        --config worker/wrangler-mh-bot.toml
#   wrangler secret put ALTEGIO_PARTNER_TOKEN --config worker/wrangler-mh-bot.toml  (опц.)
#   wrangler secret put ALTEGIO_USER_TOKEN    --config worker/wrangler-mh-bot.toml  (опц.)
#   --- Telegram-карточки КЭВ менеджерам (значения те же, что у mm-pulse-bot,
#       см. worker/pulse-deploy.local.txt; PII — только секретами, репо публичный) ---
#   wrangler secret put TELEGRAM_BOT_TOKEN    --config worker/wrangler-mh-bot.toml
#   wrangler secret put TELEGRAM_CHAT_ID      --config worker/wrangler-mh-bot.toml
#
# После деплоя URL вебхука для message.help:
#   https://mh-bot.<account>.workers.dev/?secret=<WEBHOOK_SECRET>
